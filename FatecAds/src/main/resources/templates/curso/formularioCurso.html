<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cursos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/orbit.css">
</head>
<body class="page">
    <main class="shell">
        <a class="back-link" href="/">Voltar para a pagina inicial</a>

        <header class="page-header">
            <div>
                <h1>Cadastro de Cursos</h1>
                <p class="subtitle">Defina o ritmo e a carga academica.</p>
            </div>
        </header>

        <section class="card">
            <form class="form-grid" th:action="@{/cursos/salvar}" th:object="${curso}" method="post">
                <input type="hidden" th:field="*{idCurso}" />

                <div class="field">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" th:field="*{nomeCurso}" />
                </div>

                <div class="field">
                    <label for="periodo">Periodo</label>
                    <input type="text" id="periodo" th:field="*{periodoCurso}" />
                </div>

                <div class="field">
                    <label for="cargaHoraria">Carga Horaria</label>
                    <input type="number" id="cargaHoraria" th:field="*{cargahorariaCurso}" />
                </div>

                <div class="actions">
                    <button class="btn" type="submit">Salvar</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
