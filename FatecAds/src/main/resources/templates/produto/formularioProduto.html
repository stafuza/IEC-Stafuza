<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos | FatecADS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/orbit.css">
</head>
<body class="page">
    <main class="shell">
        <a class="back-link" href="/home">Voltar à Home</a>

        <header class="page-header">
            <div>
                <span class="eyebrow">Produtos</span>
                <h1 th:text="${produto.idProduto == null ? 'Cadastrar produto' : 'Editar produto'}">Cadastrar produto</h1>
                <p class="subtitle">Mantenha as informações e a apresentação do catálogo atualizadas.</p>
            </div>
            <a class="back-link" href="/produtos/listar">Ver produtos</a>
        </header>

        <section class="card">
            <form class="form-grid" th:action="@{/produtos/salvar}" method="post" enctype="multipart/form-data" th:object="${produto}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{idProduto}">

                <div class="field">
                    <label for="descricaoProduto">Descrição do produto</label>
                    <input type="text" id="descricaoProduto" th:field="*{descricaoProduto}" required maxlength="40">
                </div>

                <div class="field">
                    <label for="valorProduto">Valor do produto</label>
                    <input type="number" id="valorProduto" th:field="*{valorProduto}" min="0" step="0.01" required>
                </div>

                <div class="field">
                    <label for="unidadeProduto">Unidade</label>
                    <input type="text" id="unidadeProduto" th:field="*{unidadeProduto}" required maxlength="10" placeholder="Ex.: unidade, caixa ou pacote">
                </div>

                <div class="field">
                    <label for="marcaProduto">Marca</label>
                    <input type="text" id="marcaProduto" th:field="*{marcaProduto}" required maxlength="30">
                </div>

                <div class="field">
                    <label for="imagem">Foto do produto</label>
                    <input type="file" id="imagem" name="imagem" accept="image/jpeg,image/png,image/webp">
                    <p class="file-hint">Envie JPG, PNG ou WebP de até 5 MB. Deixe em branco para manter a foto atual.</p>
                </div>

                <div class="field" th:if="${produto.idProduto != null and produto.imagemProduto != null}">
                    <label>Foto atual</label>
                    <img class="product-image" th:src="@{/produtos/{id}/imagem(id=${produto.idProduto})}" alt="Foto atual do produto">
                </div>

                <div class="actions">
                    <button class="btn" type="submit">Salvar produto</button>
                    <a class="back-link" href="/produtos/listar">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
