<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Professores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/orbit.css">
</head>

<body class="page">
    <main class="shell">
        <a class="back-link" href="/">Voltar para a pagina inicial</a>

        <header class="page-header">
            <div>
                <h1>Listagem de Professores</h1>
                <p class="subtitle">Corpo docente com dados em dia.</p>
            </div>
            <a class="primary-link" href="/professores/criar">Criar Novo Professor</a>
        </header>

        <section class="card">
            <table class="data-table">
        <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>Graduação</th>
            <th>RM</th>
            <th colspan="2">Ações</th>
        </tr>
        <tr th:each="professor : ${professores}">
            <td th:text="${professor.nomeProfessor}">*</td>
            <td th:text="${professor.telefoneProfessor}">*</td>
            <td th:text="${professor.graduacaoProfessor}">*</td>
            <td th:text="${professor.rmProfessor}">*</td>
            <td class="action-links">
                <a th:href="@{/professores/editar/{id}(id=${professor.idProfessor})}">Editar</a>
                <a th:href="@{/professores/excluir/{id}(id=${professor.idProfessor})}">Excluir</a>
            </td>
        </tr>
            </table>
        </section>
    </main>
</body>

</html>
