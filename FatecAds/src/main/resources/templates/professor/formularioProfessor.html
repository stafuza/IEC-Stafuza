<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Professores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/orbit.css">
</head>
<body class="page">
    <main class="shell">
        <a class="back-link" href="/">Voltar para a pagina inicial</a>

        <header class="page-header">
            <div>
                <h1>Cadastro de Professores</h1>
                <p class="subtitle">Os detalhes que movem a sala de aula.</p>
            </div>
        </header>

        <section class="card">
            <form class="form-grid" th:action="@{/professores/salvar}" th:object="${professor}" method="post">
                <input type="hidden" th:field="*{idProfessor}" />

                <div class="field">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" th:field="*{nomeProfessor}" />
                </div>

                <div class="field">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" th:field="*{telefoneProfessor}" />
                </div>

                <div class="field">
                    <label for="graduacao">Graduacao</label>
                    <input type="text" id="graduacao" th:field="*{graduacaoProfessor}" />
                </div>

                <div class="field">
                    <label for="rm">RM</label>
                    <input type="number" id="rm" th:field="*{rmProfessor}" />
                </div>

                <div class="actions">
                    <button class="btn" type="submit">Salvar</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
