<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuarios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/orbit.css">
</head>
<body class="page">
    <main class="shell">
        <a class="back-link" href="/home">Voltar para a pagina inicial</a>

        <header class="page-header">
            <div>
                <h1>Cadastro de Usuarios</h1>
                <p class="subtitle">Crie e atualize acessos para o sistema.</p>
            </div>
        </header>

        <section class="card">
            <form class="form-grid" th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{idUsuario}" />
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="field">
                    <label for="nomeUsuario">Nome</label>
                    <input type="text" id="nomeUsuario" th:field="*{nomeUsuario}" />
                </div>

                <div class="field">
                    <label for="emailUsuario">Email</label>
                    <input type="email" id="emailUsuario" th:field="*{emailUsuario}" />
                </div>

                <div class="field">
                    <label for="loginUsuario">Usuario</label>
                    <input type="text" id="loginUsuario" th:field="*{loginUsuario}" />
                </div>

                <div class="field">
                    <label for="senhaUsuario">Senha</label>
                    <input type="password" id="senhaUsuario" th:field="*{senhaUsuario}" />
                </div>

                <div class="field">
                    <label for="roleUsuario">Perfil</label>
                    <input type="text" id="roleUsuario" th:field="*{roleUsuario}" />
                </div>

                <div class="actions">
                    <button class="btn" type="submit">Salvar</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
