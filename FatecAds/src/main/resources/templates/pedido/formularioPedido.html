<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Pedidos</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>

<body>
    <h1 style="text-align: center;">Cadastro de Pedidos</h1>
    <datalist id="listaAlunos">
        <option th:each="aluno : ${alunos}" th:value="${aluno.idAluno + ' - ' + aluno.nomeAluno}">
        </option>
    </datalist>

    <datalist id="listaProdutos">
        <option th:each="produto : ${produtos}" th:value="${produto.idProduto + ' - ' + produto.descricaoProduto}"
            th:attr="data-preco=${produto.valorProduto}">
        </option>
    </datalist>

    <h1>Cadastro de Pedidos</h1>
    <a href="@(/home)">Voltar</a>

    <p>I. Identificação do Aluno</p>
    <label for="aluno">Aluno:</label>
    <br />
    <input list="listaAlunos" type="text" id="aluno" placeholder="Digite o nome oucódigo do aluno">
    <br />br/>

    <p>II. Adicionar produto ao pedido</p>
    <label for="produto">Produto:</label>
    <input list="listaProdutos" type="text" id="produto" placeholder="Digite o nome ou código do produto">
    <br /><br />
    
    <label for="quantidade">Quantidade:</label>
    <input type="number" id="quantidade" placeholder="0" min="1">
    <br />

    <p
    <button type="button" onclick="adicionarItem()">
        <span>+ </span> Adicionar
    </button>

    <!-- Tabela de Itens do Pedido -->
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço Unitário</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody id="tabela-itens">
            <tr id="empty-row">
                <td colspan="5">Nenhum item adicionado ao pedido</td>
            </tr>
        </tbody>
    </table>
    <br>
    <span id="total-pedido">Total do Pedido</span>
    <span>R$ </span><span id="totalPedido">0,00</span>
    <br /><br />
    <button onclick="salvarPedido()">Finalizar Pedido</button>


    <script>
        let itens = [];

        function adicionarItem() {
            let produtoInput = document.getElementById("produto").value;
            let quantidade = document.getElementById("quantidade").value;

            if (!produtoInput || quantidade <= 0) {
                alert("Preencha corretamente o produto e a quantidade!");
                return;
            }

            let partes = produtoInput.split(" - ");
            let produtoId = partes[0];
            let produtoNome = partes[1];

            let options = document.querySelectorAll("#listaProdutos option");
            let preco = null;

            options.forEach(opt => {
                if (opt.value === produtoInput) {
                    preco = opt.getAttribute("data-preco");
                }
            });

            if (!preco) {
                alert("Produto inválido! Selecione um produto da lista.");
                return;
            }

            let subtotal = quantidade * preco;

            itens.push({
                produto: { idProduto: produtoId },
                nomeProduto: produtoNome,
                quantidade: parseInt(quantidade),
                preco: parseFloat(preco),
                subtotal: subtotal
            });

            document.getElementById("produto").value = "";
            document.getElementById("quantidade").value = "";

            renderTabela();
        }

        function removerItem(index) {
            itens.splice(index, 1);
            renderTabela();
        }

        function renderTabela() {
            let tabela = document.getElementById("tabela-itens");
            let emptyRow = document.getElementById("empty-row");

            tabela.innerHTML = "";

            if (itens.length === 0) {
                tabela.innerHTML = `<tr class="empty-row" id="empty-row"><td colspan="5">Nenhum produto adicionado ao pedido.</td></tr>`;
                document.getElementById("totalPedido").innerText = "0,00";
                return;
            }

            let total = 0;

            itens.forEach((item, index) => {
                total += item.subtotal;
                tabela.innerHTML += `
<tr>
<td>${item.nomeProduto}</td>
<td>${item.quantidade}</td>
<td>R$ ${item.preco.toFixed(2).replace('.', ',')}</td>
<td>R$ ${item.subtotal.toFixed(2).replace('.', ',')}</td>
<td><button class="btn-remove" onclick="removerItem(${index})">Remover</button></td>
</tr>
                `;
            });

            document.getElementById("totalPedido").innerText = total.toFixed(2).replace('.', ',');
        }

        function salvarPedido() {
            let alunoInput = document.getElementById("aluno").value;

            if (!alunoInput) {
                alert("Selecione um aluno antes de salvar!");
                return;
            }

            if (itens.length === 0) {
                alert("Adicione ao menos um produto ao pedido!");
                return;
            }

            let alunoId = alunoInput.split(" - ")[0];

            let pedido = {
                aluno: { idAluno: alunoId },
                itens: itens
            };

            let csrfToken = document.querySelector('meta[name="_csrf"]').content;
            let csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

            fetch("/pedidos", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify(pedido)
            })
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`HTTP ${res.status}`);
                    }
                    alert("Pedido salvo com sucesso!");
                    location.reload();
                })
                .catch(err => {
                    alert("Erro ao salvar o pedido. Tente novamente.");
                    console.error(err);
                });
        }
    </script>
</body>

</html>
