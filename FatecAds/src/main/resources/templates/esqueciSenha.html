<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/orbit.css">
</head>

<body class="page">
    <main class="shell auth-shell">
        <section class="auth-card auth-single">
            <div class="auth-copy">
                <span class="eyebrow">Recuperacao</span>
                <h1>Esqueci minha senha</h1>
                <p>Informe o email cadastrado e enviaremos um link de redefinicao.</p>
            </div>

            <div class="auth-panel">
                <h2>Recuperar acesso</h2>
                <p class="subtitle">Voce recebera as instrucoes para criar uma nova senha.</p>

                <form class="form-grid" method="post" th:action="@{/esqueci-senha}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="actions">
                        <button class="btn" type="submit">Enviar link</button>
                        <a class="ghost-link" href="/login">Voltar</a>
                    </div>
                </form>

                <p class="form-hint" th:if="${message}" th:text="${message}"></p>
                <div class="form-hint" th:if="${resetLink}">
                    <span>Ambiente sem SMTP: </span>
                    <a class="ghost-link" th:href="${resetLink}">Redefinir senha</a>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
